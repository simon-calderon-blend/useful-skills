[project]
name = "padding-gate"
version = "0.1.0"
description = "Pad the doc-extraction conveyor so a small Bedrock Batch job can cross min_records_per_job (dev/test only)."
requires-python = ">=3.13"
dependencies = ["boto3>=1.35"]

[project.scripts]
padding-gate = "padding_gate.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/padding_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
