[project]
name = "iae-launch"
version = "0.1.0"
description = "Scripts de la skill launching-iae-pipeline-runs (preflight, prepare, launch, monitor)"
requires-python = ">=3.13"
dependencies = ["boto3", "jsonschema"]

[dependency-groups]
dev = ["pytest", "pytest-cov"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["iae_launch"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "I"]
ignore = ["S603", "S607"]  # subprocess con argv fijo (aws ssm start-session)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731", "S107", "S101", "S105", "S106", "S108", "B011", "E501", "B017"]
