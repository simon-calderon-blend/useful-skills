/* Blend web tokens. Source of truth: Blend share canon (ai-evaluation-workshop,
   knowledge-work-transformation, blend-spark-harness-engineering) + the official
   Design System bundle (blend-brb-screen/_ds/.../tokens/colors.css).
   Navy for WEB is #053057. #003059 is DOCX-only (blend-documents) and must not appear here. */
:root {
  /* Brand (8 official + 1 rare accent) */
  --blend-navy: #053057;        /* "washed blue" */
  --blend-cyan: #00EDED;        /* neon turquoise: fills, lines, on-dark text. NEVER text on light */
  --blend-cyan-soft: #A2F3F3;   /* light turquoise */
  --blend-paper: #F4F3F0;       /* off-white */
  --blend-slate: #314550;       /* cool gray */
  --blend-ink: #1A1A1A;
  --blend-black: #0B0D0E;
  --blend-white: #FFFFFF;
  --blend-pink: #FF2D9B;        /* rare accent, decks only */

  /* Derived (from the Design System bundle, so they are traceable) */
  --blend-teal: #007676;        /* ok / accessible teal text on light */
  --blend-link: #075089;        /* accent on light (Starlight common.css) */
  --blend-link-dark: #00C6C6;   /* accent on dark (Starlight common.css) */
  --blend-mist: #E8EDF0;
  --state-ok: #007676;
  --state-warn: #B86A12;
  --state-bad: #C8412B;
  --state-info: #11567F;

  /* Semantic (light theme = default) */
  --bg: var(--blend-paper);
  --surface: var(--blend-white);
  --text: var(--blend-ink);
  --text-muted: var(--blend-slate);
  --heading: var(--blend-navy);
  --accent: var(--blend-link);
  --hairline: rgba(5, 48, 87, .13);
  --on-brand: var(--blend-white);
  --on-brand-accent: var(--blend-cyan);

  /* Type: PP Telegraf Regular is bundled in assets/fonts and embedded by blend_web.py (base64).
     Montserrat is the fallback when the font is not embedded (--font none). */
  --font: 'PP Telegraf', 'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --fw: 400;                    /* PP Telegraf is used at 400 only */

  /* Shape and rhythm */
  --radius: 12px;
  --radius-lg: 14px;
  --gap: 1rem;
  --measure: 48ch;              /* about 72 characters: the 0 of PP Telegraf is 1.5x its average letter, so 68ch was 104 */

  /* ---- Design-system tokens (layout, not brand). See references/design-principles.md ---- */
  /* Spacing: one scale on a 4px base. No spacing value outside it. */
  --s-1: .25rem; --s-2: .5rem; --s-3: .75rem; --s-4: 1rem; --s-5: 1.5rem;
  --s-6: 2rem; --s-7: 3rem; --s-8: 4rem; --s-9: 6rem;
  /* Widths: every page uses one of these, so the left line is the same from header to footer. */
  --w-page: 72rem;              /* documents, portals, landings */
  --w-wide: 80rem;              /* dashboards, API reference, sidebar layouts */
  --gutter: clamp(1rem, 4vw, 2.5rem);
  /* Type roles, ratio 1.2 from a 16px body. Weight stays 400: hierarchy is size, space and tone. */
  --t-micro: .75rem;            /* 12px floor: chips, table meta */
  --t-small: .875rem;           /* captions, labels, secondary */
  --t-body: 1rem;
  --t-lead: 1.2rem;             /* standfirst, card title, h3 */
  --t-h2: 1.728rem;
  --t-h1: 2.488rem;
  --t-figure: 2.074rem;         /* KPI value: never larger than the h1 */
  --t-display: clamp(2.2rem, 1.3rem + 3.6vw, 3.6rem);  /* persuade pages only (landing, one-pager, hero) */
  /* Motion: three durations, one curve. Only transform, opacity and colour move. */
  --dur-1: 120ms;               /* press, feedback */
  --dur-2: 220ms;               /* hover, menu, indicator */
  --dur-3: 420ms;               /* panel, progress */
  --ease: cubic-bezier(.2, .8, .2, 1);
  /* Controls */
  --tap: 2.75rem;               /* 44px hit target */
  --radius-sm: 6px;             /* inner radius = outer radius - padding */
  --focus: var(--accent);       /* navy surfaces set --focus: var(--blend-cyan) */
  /* Tinted wells, derived from the state tokens (no new hex). State colours are fills and borders,
     never small text on light: warn is 4.1:1 on white, bad 4.5:1 on paper. */
  --tint-note: color-mix(in srgb, var(--blend-cyan-soft) 30%, var(--surface));
  --tint-key: color-mix(in srgb, var(--blend-navy) 7%, var(--surface));
  --tint-ok: color-mix(in srgb, var(--state-ok) 9%, var(--surface));
  --tint-warn: color-mix(in srgb, var(--state-warn) 16%, var(--surface));
  --tint-bad: color-mix(in srgb, var(--state-bad) 13%, var(--surface));
  --tint-info: color-mix(in srgb, var(--state-info) 8%, var(--surface));
}
/* Shared Blend web components. Requires tokens.css. Plain CSS, no dependencies.
   Design rules behind these choices: references/design-principles.md. */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scrollbar-color: color-mix(in srgb, var(--heading) 35%, transparent) transparent; }
body { margin: 0; background: var(--bg); color: var(--text); font: var(--fw) var(--t-body)/1.65 var(--font);
  caret-color: var(--accent); accent-color: var(--blend-navy); text-wrap: pretty; overflow-wrap: break-word; }
::selection { background: var(--blend-cyan-soft); color: var(--blend-navy); }

/* Headings: weight is always 400, so hierarchy is size, space and colour. A heading belongs to what
   follows it: twice the space above as below. */
h1, h2, h3 { color: var(--heading); font-weight: var(--fw); line-height: 1.15; letter-spacing: -.01em; text-wrap: balance; }
h1 { font-size: clamp(2rem, 1.5rem + 2vw, var(--t-h1)); letter-spacing: -.02em; max-width: 24ch; margin: 0 0 var(--s-4); }
h2 { font-size: clamp(1.44rem, 1.2rem + 1vw, var(--t-h2)); max-width: 32ch; margin: var(--s-7) 0 var(--s-4); }
h3 { font-size: var(--t-lead); line-height: 1.3; max-width: 44ch; margin: var(--s-6) 0 var(--s-2); }
p { margin: 0 0 var(--s-4); }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: .18em; }
img, svg { max-width: 100%; }
/* The brand face has one weight. Emphasis is tone (navy), never a browser-synthesised bold. */
body { font-synthesis: none; }
:where(strong, b, th) { font-weight: var(--fw); }
:where(strong, b) { color: var(--heading); }
:where(.b-hero, .b-band, [class*="-hero"], [class*="-cta"], [class*="-band"], th, pre) :where(strong, b) { color: inherit; }
::placeholder { color: var(--text-muted); opacity: 1; }

/* One eyebrow per page (masthead or hero). Every other small label is .b-label: sentence case, no tracking. */
.b-eyebrow { font-size: var(--t-micro); text-transform: uppercase; letter-spacing: .14em; color: var(--text-muted); }
.b-label { font-size: var(--t-small); color: var(--text-muted); }
.b-prose { max-width: var(--measure); }
.b-num, .b-kpi .v, .b-table td.num, .b-table th.num { font-variant-numeric: tabular-nums; }
.b-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.b-skip { position: absolute; left: var(--s-4); top: var(--s-2); z-index: 100; padding: var(--s-2) var(--s-4); background: var(--blend-navy);
  color: var(--blend-white); border-radius: var(--radius-sm); transform: translateY(-200%); }
.b-skip:focus { transform: none; }

/* Header with logo */
.b-header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: var(--s-4);
  padding: var(--s-3) var(--gutter); background: var(--bg); border-bottom: 1px solid var(--hairline); }
.b-header .blend-logo { height: 22px; width: auto; color: var(--blend-navy); display: block; }

/* Hero and CTA band: the navy region. Cyan is text only here; secondary text is soft cyan, never grey or opacity. */
.b-hero, .b-band { --focus: var(--blend-cyan); --kpi-rule: color-mix(in srgb, var(--blend-cyan-soft) 35%, transparent); background: var(--blend-navy); color: var(--blend-white);
  padding: clamp(2rem, 6vw, 5rem) var(--gutter); }
.b-hero h1, .b-band h2 { color: var(--blend-cyan); }
.b-hero ::selection, .b-band ::selection { background: var(--blend-cyan); color: var(--blend-navy); }

/* Buttons. One filled .b-btn per view: the primary action. Everything else is .secondary or a link.
   Pill radius is for controls (buttons, chips, search), not for containers. */
.b-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); min-height: var(--tap); padding: var(--s-2) var(--s-5);
  border-radius: 999px; border: 1px solid transparent; background: var(--blend-cyan); color: var(--blend-navy); font: inherit; line-height: 1.2;
  text-decoration: none; white-space: nowrap; cursor: pointer;
  transition: background-color var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease), color var(--dur-2) var(--ease), transform var(--dur-1) var(--ease); }
.b-btn.secondary { background: transparent; color: var(--heading); border-color: color-mix(in srgb, var(--heading) 45%, transparent); }
.b-hero .b-btn.secondary, .b-band .b-btn.secondary { color: var(--blend-white); border-color: var(--blend-cyan-soft); }
@media (hover: hover) {
  .b-btn:hover { background: color-mix(in srgb, var(--blend-cyan) 84%, var(--blend-navy)); }
  .b-btn.secondary:hover { background: color-mix(in srgb, var(--heading) 8%, transparent); border-color: var(--heading); }
  .b-hero .b-btn.secondary:hover, .b-band .b-btn.secondary:hover { background: color-mix(in srgb, var(--blend-white) 12%, transparent); border-color: var(--blend-white); }
}
.b-btn:active { transform: translateY(1px); }
.b-btn:disabled, .b-btn[aria-disabled="true"] { opacity: .55; cursor: not-allowed; transform: none; }

/* Containers: space first, then a hairline, then a tinted well, then a card. Never a card inside a card. */
.b-card { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius-lg); padding: var(--s-5); min-width: 0; }
/* carded KPI (decks): compact, so existing slides keep their height */
.b-card.b-kpi { padding: var(--s-4) var(--s-5); }
.b-card.b-kpi .l { margin-top: 0; }
.b-well { background: var(--tint-key); border-radius: var(--radius); padding: var(--s-4) var(--s-5); min-width: 0; }

/* KPI figures: a row parted by hairlines, not a strip of identical cards. Each figure carries its unit
   in .v, what it counts in .l and a qualifier (target, baseline, period) in .c. */
.b-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--s-5) var(--gap); }
.b-kpis:not(:has(> .b-card)) { gap: var(--s-5) 0; margin-left: calc(var(--s-5) * -1); clip-path: inset(0 0 0 var(--s-5)); }
.b-kpis > .b-kpi:not(.b-card) { padding: 0 var(--s-5); box-shadow: -1px 0 0 var(--kpi-rule, var(--hairline)); min-width: 0; }
/* phone: an odd count would strand one figure on the last row, so the row becomes a list */
@media (max-width: 40rem) {
  .b-kpis:not(:has(> .b-card)):has(> .b-kpi:nth-child(odd):last-child) { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .b-kpis:has(> .b-kpi:nth-child(odd):last-child) > .b-kpi:not(.b-card) { box-shadow: none; padding-block: var(--s-3); border-top: 1px solid var(--kpi-rule, var(--hairline)); }
  .b-kpis:has(> .b-kpi:nth-child(odd):last-child) > .b-kpi:not(.b-card):first-child { border-top: 0; padding-top: 0; }
}
.b-kpi .v { display: block; font-size: clamp(1.6rem, 1.2rem + 1.6vw, var(--t-figure)); color: var(--heading); line-height: 1.1; white-space: nowrap; }
.b-kpi .l { display: block; font-size: var(--t-small); color: var(--text); margin-top: var(--s-1); }
.b-kpi .c { display: block; font-size: var(--t-micro); color: var(--text-muted); margin-top: var(--s-1); }

/* Callouts: a tinted well with a worded title, no side stripe. The kind is said in words, not by colour alone. */
.b-callout { background: var(--tint-key); border-radius: var(--radius); padding: var(--s-4) var(--s-5); min-width: 0; }
.b-callout.key { background: var(--tint-note); }   /* the one that asks for something gets the accent tint */
.b-callout.warn { background: var(--tint-warn); }
.b-callout.bad { background: var(--tint-bad); }
.b-callout .t { display: block; color: var(--heading); margin-bottom: var(--s-1); }
.b-callout.warn .t::before, .b-callout.bad .t::before { content: ""; display: inline-block; width: .5em; height: .5em; border-radius: 50%; margin-right: .5em; vertical-align: .1em; background: var(--state-warn); }
.b-callout.bad .t::before { background: var(--state-bad); }
.b-callout > :last-child { margin-bottom: 0; }

/* Chips: status in words, with the state colour as dot and border (state colours fail AA as small text). */
.b-chip { display: inline-flex; align-items: center; gap: .4em; padding: .15rem .6rem; border-radius: 999px; font-size: var(--t-micro); line-height: 1.5;
  border: 1px solid var(--hairline); color: var(--text-muted); white-space: nowrap; }
.b-chip.ok, .b-chip.warn, .b-chip.bad, .b-chip.info { color: var(--text); }
.b-chip.ok::before, .b-chip.warn::before, .b-chip.bad::before, .b-chip.info::before { content: ""; width: .5em; height: .5em; border-radius: 50%; background: currentColor; flex: none; }
.b-chip.ok { border-color: var(--state-ok); } .b-chip.ok::before { background: var(--state-ok); }
.b-chip.warn { border-color: var(--state-warn); } .b-chip.warn::before { background: var(--state-warn); }
.b-chip.bad { border-color: var(--state-bad); } .b-chip.bad::before { background: var(--state-bad); }
.b-chip.info { border-color: var(--state-info); } .b-chip.info::before { background: var(--state-info); }
button.b-chip { font: inherit; font-size: var(--t-small); min-height: 2.25rem; background: var(--surface); color: var(--text); cursor: pointer;
  border-color: color-mix(in srgb, var(--heading) 35%, transparent);   /* controls carry a firmer edge than static chips */
  transition: background-color var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease), color var(--dur-2) var(--ease); }
button.b-chip[aria-pressed="true"] { background: var(--blend-navy); color: var(--blend-white); border-color: var(--blend-navy); }
@media (hover: hover) { button.b-chip:hover { border-color: var(--heading); } }
@media (pointer: coarse) { button.b-chip { min-height: var(--tap); padding-inline: var(--s-4); } }

/* Tables: navy head, horizontal rules only, numbers right and tabular, first column is the row's name. */
.b-table { width: 100%; border-collapse: collapse; font-size: var(--t-small); }
.b-table th { background: var(--blend-navy); color: var(--blend-white); text-align: left; padding: var(--s-2) var(--s-3); font-weight: var(--fw); white-space: nowrap; }
.b-table td { padding: var(--s-2) var(--s-3); border-bottom: 1px solid var(--hairline); vertical-align: top; }
.b-table tbody td:first-child { color: var(--heading); }
.b-table td.num, .b-table th.num { text-align: right; white-space: nowrap; }
.b-table caption { caption-side: top; text-align: left; font-size: var(--t-small); color: var(--text-muted); padding: 0 0 var(--s-2); }
.b-table-wrap { overflow-x: auto; }

.b-footer { padding: var(--s-5) var(--gutter); color: var(--text-muted); font-size: var(--t-small); border-top: 1px solid var(--hairline); }

/* Focus: instant, 2px, never animated. Navy regions switch --focus to cyan (the link blue is 1.6:1 on navy). */
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
/* Reduced motion: movement goes, colour and state changes stay. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; scroll-behavior: auto !important;
    transition-property: color, background-color, border-color, outline-color, opacity !important; }
}
@media print { .b-header { position: static; } .b-skip { display: none; } body { background: #fff; }
  .b-hero, .b-band, .b-table th, .b-callout, .b-well { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
/* Blend theme for Swagger UI (override layer). Requires blend-web-core tokens.css + components.css
   and vendor/swagger-ui.css loaded BEFORE this file. Every selector is under .swagger-ui or a b-api-* class.
   Colors come from tokens; method chips use the palette below (contrast checked in references/method-chips.md).
   An API reference is an Operate page: Swagger's structure and controls stay where readers expect them; the brand
   owns type, palette and the frame. The method is said by its chip (word + fill), never by a stripe on the block. */
:root {
  --m-get: var(--blend-navy);          /* white text */
  --m-post-bg: var(--blend-cyan-soft); /* navy text + navy border: cyan is never text on light */
  --m-put: #0E6BA8;                    /* white text, 5.7:1, series color of the dashboard shares */
  --m-delete: #B5290F;                 /* white text, 6.4:1 */
  --m-other: var(--blend-slate);       /* head, options, trace */
  --warn-bg: #FBF1E0;
  --code-bg: var(--blend-black);
  --code-fg: var(--blend-paper);
}

/* Status banner and page frame */
:root { --a-pad: max(var(--gutter), calc((100% - var(--w-wide)) / 2 + var(--gutter))); }
.b-header { padding-inline: var(--a-pad); }   /* header, banner and reference share one left line */
.b-api-band { padding: var(--s-3) var(--a-pad); font-size: var(--t-small); line-height: 1.5; border-bottom: 1px solid var(--hairline); }
.b-api-band.current { background: var(--blend-navy); color: var(--blend-white); }
.b-api-band.current { --focus: var(--blend-cyan); }
.b-api-band.current strong { color: var(--blend-cyan); font-weight: var(--fw); }
.b-api-band.proposed { background: var(--warn-bg); color: var(--blend-ink); border-bottom-color: var(--state-warn); }
.b-api-band.proposed strong { color: var(--blend-ink); font-weight: var(--fw); display: inline-flex; align-items: center; gap: .4em; margin-right: var(--s-2);
  padding: 0 var(--s-3); border: 1px solid var(--state-warn); border-radius: 999px; background: var(--blend-white); white-space: nowrap; }
.b-api-band.proposed strong::before { content: ""; width: .5em; height: .5em; border-radius: 50%; background: var(--state-warn); }
.b-api-band a { color: inherit; }
.b-api-meta { display: flex; flex-wrap: wrap; gap: var(--s-2) var(--s-4); align-items: center; font-size: var(--t-small); }
.b-header .b-api-meta { margin-left: auto; }
.b-api-meta a { color: var(--accent); }
.b-api-main { max-width: var(--w-wide); margin: 0 auto; padding: 0 var(--gutter) var(--s-8); }
.b-api-note { font-size: var(--t-small); color: var(--text-muted); padding: .75rem 0 0; }

/* Swagger base */
/* the core caps headings in ch for prose pages; Swagger's headings are layout rows */
.swagger-ui :is(h1, h2, h3, h4) { max-width: none; text-wrap: wrap; }
/* PP Telegraf has one weight: Swagger asks for 600/700 in many places, which the browser would fake */
.swagger-ui { font-synthesis: none; }
.swagger-ui :is(strong, b, label, select, button, .btn, th, td, h1, h2, h3, h4, h5, .parameter__name, .response-col_status, .model-title, .prop-type, .tablinks) { font-weight: var(--fw); }
.swagger-ui .info :is(strong, b), .swagger-ui .renderedMarkdown :is(strong, b) { color: var(--heading); }
.swagger-ui .topbar { display: none; }
.swagger-ui, .swagger-ui .info li, .swagger-ui .info p, .swagger-ui .info table, .swagger-ui .opblock-tag,
.swagger-ui .opblock .opblock-summary-description, .swagger-ui .opblock .opblock-section-header h4,
.swagger-ui .opblock-description-wrapper p, .swagger-ui .responses-inner h4, .swagger-ui .responses-inner h5,
.swagger-ui table thead tr td, .swagger-ui table thead tr th, .swagger-ui .parameter__name, .swagger-ui .tab li,
.swagger-ui .btn, .swagger-ui select, .swagger-ui label, .swagger-ui .response-col_status,
.swagger-ui .model-title, .swagger-ui section.models h4, .swagger-ui .scheme-container .schemes > label {
  font-family: var(--font); color: var(--text);
}
/* elements that Swagger leaves on sans-serif (version stamps, tag descriptions) */
.swagger-ui .info .title small pre, .swagger-ui .opblock-tag small, .swagger-ui .opblock-tag small .markdown, .swagger-ui .opblock-tag small p { font-family: var(--font); }
.swagger-ui .wrapper { max-width: none; padding: 0; }
.swagger-ui .info { margin: 2rem 0 1.25rem; }
.swagger-ui .info .title { color: #053057; font-family: var(--font); font-weight: var(--fw); font-size: clamp(1.8rem, 4vw, 2.6rem); letter-spacing: -.02em; line-height: 1.15; }
.swagger-ui .info .title small { background: var(--blend-navy); color: var(--blend-white); border-radius: 999px; font-family: var(--font); top: -4px; letter-spacing: 0; white-space: nowrap; }
.swagger-ui .info .title small pre { letter-spacing: 0; }
.swagger-ui .info .title > span { white-space: nowrap; }
.swagger-ui .info .title small.version-stamp { background: var(--blend-slate); }
.swagger-ui .info a, .swagger-ui .info .base-url { color: var(--accent); }
.swagger-ui .info .base-url { font-family: var(--font-mono); }
.swagger-ui .info h1, .swagger-ui .info h2, .swagger-ui .info h3, .swagger-ui .info h4 { color: var(--heading); font-family: var(--font); font-weight: var(--fw); }
.swagger-ui .info .description :is(p, ul, ol) { max-width: var(--measure); margin-left: 0; margin-right: 0; }
.swagger-ui .info table { border-collapse: collapse; width: auto; min-width: min(100%, 32rem); }
.swagger-ui .info table td { vertical-align: baseline; }
.swagger-ui .info .renderedMarkdown pre { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius-sm); padding: var(--s-3) var(--s-4); overflow-x: auto; max-width: 100%; }
.swagger-ui .info .renderedMarkdown pre code { background: none; padding: 0; white-space: pre; }
.swagger-ui .info table th { background: var(--blend-navy); color: var(--blend-white); padding: .4rem .6rem; text-align: left; font-weight: var(--fw); }
.swagger-ui .info table td { border-bottom: 1px solid var(--hairline); padding: .4rem .6rem; }
.swagger-ui .scheme-container { background: var(--surface); box-shadow: none; border: 1px solid var(--hairline); border-radius: var(--radius); margin: 0 0 1rem; padding: .8rem 1rem; }
.swagger-ui .opblock-tag { color: var(--heading); border-bottom: 1px solid var(--hairline); font-size: 1.25rem; font-weight: var(--fw); padding-left: 0; margin-top: var(--s-6); }
.swagger-ui .opblock-tag svg, .swagger-ui .opblock-summary-control svg, .swagger-ui .models-control svg, .swagger-ui .model-toggle svg { fill: var(--heading); }
.swagger-ui .authorization__btn svg { fill: var(--blend-slate); opacity: 1; }
.swagger-ui .authorization__btn .unlocked, .swagger-ui .authorization__btn .locked { opacity: 1; fill: var(--blend-slate); }
.swagger-ui .opblock-tag small { color: var(--text-muted); }
.swagger-ui a.nostyle, .swagger-ui .opblock-tag a { color: inherit; }
.swagger-ui .markdown code, .swagger-ui .renderedMarkdown code { background: rgba(5, 48, 87, .07); color: var(--blend-navy); font-family: var(--font-mono); }

/* Operation blocks: border and fill by method, chip with the Blend palette */
.swagger-ui .opblock { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius); box-shadow: none; margin: 0 0 var(--s-2); }
.swagger-ui .opblock .opblock-summary { border-bottom: 0; }
.swagger-ui .opblock .opblock-summary-method { font-family: var(--font); font-weight: var(--fw); border-radius: var(--radius-sm); min-width: 70px; text-shadow: none; }
.swagger-ui .opblock .opblock-summary-path, .swagger-ui .opblock .opblock-summary-path__deprecated { font-family: var(--font-mono); color: var(--text); font-size: .95rem; }
.swagger-ui .opblock .opblock-summary-operation-id { color: var(--text-muted); font-family: var(--font-mono); }
.swagger-ui .opblock .opblock-section-header { background: rgba(5, 48, 87, .05); box-shadow: none; }
.swagger-ui .opblock.opblock-get { background: color-mix(in srgb, var(--m-get) 4%, var(--surface)); }
.swagger-ui .opblock.opblock-get .opblock-summary-method, .swagger-ui .opblock.opblock-get .tab-header .tab-item.active h4 span::after { background: var(--m-get); color: var(--blend-white); }
.swagger-ui .opblock.opblock-post { background: color-mix(in srgb, var(--blend-cyan-soft) 22%, var(--surface)); }
.swagger-ui .opblock.opblock-post .opblock-summary-method { background: var(--m-post-bg); color: var(--blend-navy); border: 1px solid var(--blend-navy); }
.swagger-ui .opblock.opblock-put, .swagger-ui .opblock.opblock-patch { background: color-mix(in srgb, var(--m-put) 6%, var(--surface)); }
.swagger-ui .opblock.opblock-put .opblock-summary-method, .swagger-ui .opblock.opblock-patch .opblock-summary-method { background: var(--m-put); color: var(--blend-white); }

  transition: background-color var(--dur-2) var(--ease), color var(--dur-2) var(--ease); }

<script type="application/json" id="spec">
{
 "openapi": "3.0.3",
 "info": {
  "title": "Illustrative Orders API",
  "version": "1.1.0",
  "description": "**Illustrative.** A made-up API used to show the Blend Swagger UI theme. All identifiers, names and amounts are fictitious.\n\n| Status | Meaning |\n|---|---|\n| `open` | Order accepted, not yet shipped |\n| `shipped` | Handed to the carrier |\n| `cancelled` | Cancelled before shipping |\n\n```bash\ncurl -H 'Authorization: Bearer <token>' https://api.example.com/v1/orders\n```"
 },
 "servers": [
  {
   "url": "https://api.example.com/v1",
   "description": "Example server (not real)"
  }
 ],
 "tags": [
  {
   "name": "Orders",
   "description": "Create, read and change orders."
  },
  {
   "name": "Customers",
   "description": "Read-only customer lookups."
  }
 ],
 "paths": {
  "/orders": {
   "get": {
    "tags": [
     "Orders"
    ],
    "summary": "List orders",
    "operationId": "listOrders",
    "parameters": [
     {
      "name": "status",
      "in": "query",
      "schema": {
       "$ref": "#/components/schemas/OrderStatus"
      },
      "description": "Filter by status."
     },
     {
      "name": "limit",
      "in": "query",
      "schema": {
       "type": "integer",
       "minimum": 1,
       "maximum": 100,
       "default": 20
      },
      "example": 20
     }
    ],
    "responses": {
     "200": {
      "description": "A page of orders.",
      "content": {
       "application/json": {
        "schema": {
         "type": "array",
         "items": {
          "$ref": "#/components/schemas/Order"
         }
        },
        "example": [
         {
          "id": "ord_1001",
          "customer_id": "cus_42",
          "status": "open",
          "total": 59.9,
          "items": [
           {
            "sku": "SKU-RED-01",
            "quantity": 2
           }
          ]
         }
        ]
       }
      }
     },
     "401": {
      "$ref": "#/components/responses/Unauthorized"
     }
    }
   },
   "post": {
    "tags": [
     "Orders"
    ],
    "summary": "Create an order",
    "operationId": "createOrder",
    "requestBody": {
     "required": true,
     "content": {
      "application/json": {
       "schema": {
        "$ref": "#/components/schemas/NewOrder"
       },
       "example": {
        "customer_id": "cus_42",
        "items": [
         {
          "sku": "SKU-RED-01",
          "quantity": 2
         }
        ]
       }
      }
     }
    },
    "responses": {
     "201": {
      "description": "Order created.",
      "content": {
       "application/json": {
        "schema": {
         "$ref": "#/components/schemas/Order"
        },
        "example": {
         "id": "ord_1002",
         "customer_id": "cus_42",
         "status": "open",
         "total": 59.9,
         "items": [
          {
           "sku": "SKU-RED-01",
           "quantity": 2
          }
         ]
        }
       }
      }
     },
     "422": {
      "$ref": "#/components/responses/Invalid"
     },
     "401": {
      "$ref": "#/components/responses/Unauthorized"
     }
    }
   }
  },
  "/orders/{orderId}": {
   "parameters": [
    {
     "name": "orderId",
     "in": "path",
     "required": true,
     "schema": {
      "type": "string"
     },
     "example": "ord_1001"
    }
   ],
   "get": {
    "tags": [
     "Orders"
    ],
    "summary": "Get one order",
    "operationId": "getOrder",
    "responses": {
     "200": {
      "description": "The order.",
      "content": {
       "application/json": {
        "schema": {
         "$ref": "#/components/schemas/Order"
        },
        "example": {
         "id": "ord_1001",
         "customer_id": "cus_42",
         "status": "shipped",
         "total": 59.9,
         "items": [
          {
           "sku": "SKU-RED-01",
           "quantity": 2
          }
         ]
        }
       }
      }
     },
     "404": {
      "$ref": "#/components/responses/NotFound"
     }
    }
   },
   "put": {
    "tags": [
     "Orders"
    ],
    "summary": "Replace the items of an order",
    "operationId": "replaceOrderItems",
    "requestBody": {
     "required": true,
     "content": {
      "application/json": {
       "schema": {
        "$ref": "#/components/schemas/NewOrder"
       },
       "example": {
        "customer_id": "cus_42",
        "items": [
         {
          "sku": "SKU-BLUE-07",
          "quantity": 1
         }
        ]
       }
      }
     }
    },
    "responses": {
     "200": {
      "description": "Updated order.",
      "content": {
       "application/json": {
        "schema": {
         "$ref": "#/components/schemas/Order"
        },
        "example": {
         "id": "ord_1001",
         "customer_id": "cus_42",
         "status": "open",
         "total": 24.0,
         "items": [
          {
           "sku": "SKU-BLUE-07",
           "quantity": 1
          }
         ]
        }
       }
      }
     },
     "404": {
      "$ref": "#/components/responses/NotFound"
     }
    }
   },
   "patch": {
    "tags": [
     "Orders"
    ],
    "summary": "Change the status of an order",
    "operationId": "patchOrderStatus",
    "requestBody": {
     "required": true,
     "content": {
      "application/json": {
       "schema": {
        "type": "object",
        "required": [
         "status"
        ],
        "properties": {
         "status": {
          "$ref": "#/components/schemas/OrderStatus"
         }
        }
       },
       "example": {
        "status": "shipped"
       }
      }
     }
    },
    "responses": {
     "200": {
      "description": "Updated order.",
      "content": {
       "application/json": {
        "schema": {
         "$ref": "#/components/schemas/Order"
        },
        "example": {
         "id": "ord_1001",
         "customer_id": "cus_42",
         "status": "shipped",
         "total": 59.9,
         "items": [
          {
           "sku": "SKU-RED-01",
           "quantity": 2
          }
         ]
        }
       }
      }
     },
     "404": {
      "$ref": "#/components/responses/NotFound"
     }
    }
   },
   "delete": {
    "tags": [
     "Orders"
    ],
    "summary": "Delete an order",
    "operationId": "deleteOrder",
    "responses": {
     "204": {
      "description": "Deleted, no content."

     "404": {
      "$ref": "#/components/responses/NotFound"
     }
    }
   }
  },
  "/customers/{customerId}": {

      "name": "orderId",
      "in": "path",
      "required": true,
      "schema": {
       "type": "string"
      },
      "example": "ord_1001"
     }

    "requestBody": {
     "content": {
      "application/json": {
       "schema": {
        "type": "object",
        "properties": {
         "reason": {
          "type": "string"
         }
        }
       },
       "example": {
        "reason": "Customer request"
       }
      }
     }
    },
    "responses": {
     "200": {
      "description": "Cancelled order.",
      "content": {
       "application/json": {
        "schema": {
         "$ref": "#/components/schemas/Order"

        "example": {
         "id": "ord_1001",
         "customer_id": "cus_42",
         "status": "cancelled",
         "total": 59.9,
         "priority": "normal",
         "items": [
          {
           "sku": "SKU-RED-01",
           "quantity": 2
          }
         ]
        }
       }
      }
     },
     "404": {
      "$ref": "#/components/responses/NotFound"
     }
    }
   }
  }
 },

     }

   },

    "required": [
     "customer_id",
     "items"

    "properties": {
     "customer_id": {

     },

      "type": "array",
      "items": {
       "$ref": "#/components/schemas/OrderItem"
      }

   },
   "Customer": {
    "type": "object",

      "type": "string",
      "example": "cus_42"
     },

      "type": "string",

     }

 "security": [
